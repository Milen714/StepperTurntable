<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turntable Control</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background: #f4f6f8; }
    .turntable-card { width: min(420px, calc(100% - 32px)); padding: 28px; border-radius: 24px; background: white; box-shadow: 0 10px 35px rgba(0,0,0,.12); }
    .turntable-card h1 { margin: 0 0 8px; text-align: center; }
    .status { margin: 0 0 24px; text-align: center; color: #666; }
    .control-row { margin: 22px 0; }
    .control-row label { display: block; margin-bottom: 10px; font-weight: 700; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; }
    .switch { position: relative; width: 62px; height: 34px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-toggle { position: absolute; inset: 0; border-radius: 34px; background: #b8bcc2; cursor: pointer; transition: .2s; }
    .slider-toggle:before { content: ""; position: absolute; width: 26px; height: 26px; left: 4px; top: 4px; border-radius: 50%; background: white; transition: .2s; }
    .switch input:checked + .slider-toggle { background: #4f46e5; }
    .switch input:checked + .slider-toggle:before { transform: translateX(28px); }
    .direction-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .direction-buttons button { min-height: 48px; border: 1px solid #d7dbe2; border-radius: 12px; background: #f8f9fb; font-weight: 700; cursor: pointer; }
    .direction-buttons button.active { border-color: #4f46e5; background: #4f46e5; color: white; }
    .speed-header { display: flex; justify-content: space-between; }
    input[type="range"] { width: 100%; }
  </style>
</head>
<body>
  <main class="turntable-card">
    <h1>Turntable</h1>
    <p class="status" id="status-text">Loading…</p>

    <div class="control-row switch-row">
      <label for="enabled">Turntable power</label>
      <label class="switch">
        <input type="checkbox" id="enabled">
        <span class="slider-toggle"></span>
      </label>
    </div>

    <div class="control-row">
      <label>Direction</label>
      <div class="direction-buttons">
        <button type="button" data-direction="CW" class="active">Clockwise</button>
        <button type="button" data-direction="CCW">Counterclockwise</button>
      </div>
    </div>

    <div class="control-row">
      <div class="speed-header">
        <label for="speed">Speed</label>
        <strong id="speed-value">50%</strong>
      </div>
      <input type="range" id="speed" min="1" max="100" value="50">
    </div>
  </main>
  <script src="turntable-control.js"></script>
</body>
</html>
